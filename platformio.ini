; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@ ^6.13.0
framework = arduino
build_flags = 
	-std=gnu++17
	-DPROJECT_NETWORK_TX_CHUNK_SIZE=1460
monitor_speed = 460800
build_type = debug
debug_build_flags = -Ofast
monitor_filters = esp32_exception_decoder
monitor_port = COM26
lib_deps = 
	gyverlibs/GTL@^1.4.7
	gyverlibs/Settings@^1.4.2
	gyverlibs/StringUtils@^1.6.1
	gyverlibs/mString@^1.7.3
	gyverlibs/GyverDB@^1.4.4
	gyverlibs/GTimer@^1.1.3
	olikraus/U8g2
	spacehuhn/SimpleCLI@^1.1.4
	
build_unflags = -std=gnu++11

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
debug_tool = esp-builtin
debug_speed = 5000
board_build.partitions = default.csv
build_flags = 
	${env.build_flags}
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DHW_VARIANT_ESP32_C3=1
	-DPROJECT_OTA_HOSTNAME=\"esp32-c3-uart\"
	-DPROJECT_BOOT_SERIAL_DELAY_MS=0

[env:esp32-c3-devkitm-1_ota]
board = esp32-c3-devkitm-1
debug_tool = esp-builtin
debug_speed = 5000
board_build.partitions = default.csv
upload_protocol = espota
upload_port = 192.168.0.222
upload_flags = 
	--port=3232
build_flags = 
	${env.build_flags}
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DHW_VARIANT_ESP32_C3=1
	-DPROJECT_OTA_HOSTNAME=\"esp32-c3-uart\"
	-DPROJECT_BOOT_SERIAL_DELAY_MS=0

; ESP32-C3 0.42-inch OLED board (SSD1306-compatible, 72x40, I2C).
; The display is connected on-board to GPIO5 (SDA) and GPIO6 (SCL).
