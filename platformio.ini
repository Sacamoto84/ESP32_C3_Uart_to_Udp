	${env.build_flags}
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DHW_VARIANT_ESP32_C3_OLED_72X40=1
	-DPROJECT_OTA_HOSTNAME=\"esp32-c3-oled\"
	-DPROJECT_BOOT_SERIAL_DELAY_MS=0

[env:esp32-c3-oled-72x40_ota]
board = esp32-c3-devkitm-1
debug_tool = esp-builtin
debug_speed = 5000
board_build.partitions = default.csv
