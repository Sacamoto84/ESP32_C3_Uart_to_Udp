	--port=3232
build_flags =
	${env.build_flags}
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DHW_VARIANT_ESP32_C3_OLED_72X40=1
	-DPROJECT_OTA_HOSTNAME=\"esp32-c3-oled\"
	-DPROJECT_BOOT_SERIAL_DELAY_MS=0

[env:lolin_s2_mini]
board = lolin_s2_mini
board_build.partitions = default.csv
board_build.arduino.memory_type = dio_qspi
build_flags = 
	${env.build_flags}
	-DBOARD_HAS_PSRAM
	-DHW_VARIANT_ESP32_S2_MINI=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DPROJECT_OTA_HOSTNAME=\"esp32-s2-uart\"

